#
# Windows: Release VST3, unit tests, pluginval (strictness 10), the .vst3 as an artifact, and an
#          installer (.exe) that is itself tested: install, reinstall, uninstall.
# Linux:   build and unit tests.
# Tags v*: a GitHub Release with the zipped .vst3 and the installer.

name: Build

on:
  push:
    branches: [main, "phase/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  VST3_DIR: build/PMelodies_artefacts/Release/VST3

jobs:
  windows:
    name: Windows · VST3, tests, pluginval
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      # pluginval is a GUI-subsystem executable: PowerShell would not wait for it, bash does.
      - name: pluginval (strictness 10)
        shell: bash
        run: |
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --verbose \
            --output-dir pluginval-logs --timeout-ms 900000 \
            --validate "$VST3_DIR/P.Melodies.vst3"

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pluginval-logs-windows
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: P.Melodies-windows-vst3
          path: ${{ env.VST3_DIR }}/
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $version = (Get-Content build/version.txt -Raw).Trim()
          $bundle = (Resolve-Path "$env:VST3_DIR/P.Melodies.vst3").Path
          $output = Join-Path $PWD 'installer-out'
          & $iscc /Qp "/DAppVersion=$version" "/DVst3Bundle=$bundle" "/DOutputDir=$output" installer\PMelodies.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer-out

      - name: Test installer (install, reinstall, uninstall)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer-out/*.exe | Select-Object -First 1).FullName
          ./installer/test-installer.ps1 -Installer $installer -BuildBundle "$env:VST3_DIR/P.Melodies.vst3"

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installer-logs-windows
          path: installer-*.log
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: P.Melodies-windows-installer
          path: installer-out/*.exe
          if-no-files-found: error

  linux:
    name: Linux · build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: P.Melodies-windows-vst3
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: P.Melodies-windows-installer
          path: installer

      - name: Zip the VST3
        run: cd dist && zip -r "../P.Melodies-${GITHUB_REF_NAME}-windows-vst3.zip" P.Melodies.vst3

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            P.Melodies-${{ github.ref_name }}-windows-vst3.zip
            installer/*.exe
          generate_release_notes: true
